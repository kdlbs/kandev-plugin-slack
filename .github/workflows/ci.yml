name: CI

on:
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, vet, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          path: plugin

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Install public SDK and check module files
        working-directory: plugin
        run: |
          set -euo pipefail
          go mod download
          go mod tidy
          make sdk-check
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        working-directory: plugin
        run: make check-format

      - name: Vet
        working-directory: plugin
        run: make vet

      - name: Test
        working-directory: plugin
        run: make test

  minimum-host:
    name: Smoke test Kandev 0.99.0
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          path: plugin

      - name: Read pinned packaging tooling revision
        id: tooling
        working-directory: plugin
        run: |
          set -euo pipefail
          tooling_ref="$(cat .kandev-tooling-ref)"
          [[ "$tooling_ref" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=$tooling_ref" >> "$GITHUB_OUTPUT"

      - name: Check out pinned packaging tooling
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: kdlbs/kandev
          ref: ${{ steps.tooling.outputs.ref }}
          path: kandev
          sparse-checkout: |
            apps/backend
            pluginsdk

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Test and package for the minimum host
        working-directory: plugin
        run: |
          set -euo pipefail
          make check-format
          go mod download
          make sdk-check
          make vet test-go
          make test-package-verifier test-release-version
          make verify-package-host

      - name: Download and verify released minimum host
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/minimum-host"
          gh release download v0.99.0 --repo kdlbs/kandev \
            --pattern kandev-linux-x64.tar.gz \
            --pattern kandev-linux-x64.tar.gz.sha256 \
            --dir "$RUNNER_TEMP/minimum-host"
          cd "$RUNNER_TEMP/minimum-host"
          sha256sum -c kandev-linux-x64.tar.gz.sha256
          tar -xzf kandev-linux-x64.tar.gz

      - name: Install and smoke test on minimum host
        working-directory: plugin
        run: make test-minimum-host KANDEV_HOST_BIN="$RUNNER_TEMP/minimum-host/kandev/bin/kandev"

  package:
    name: Build and verify all platform packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          path: plugin

      - name: Read pinned packaging tooling revision
        id: tooling
        working-directory: plugin
        run: |
          set -euo pipefail
          tooling_ref="$(cat .kandev-tooling-ref)"
          [[ "$tooling_ref" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=$tooling_ref" >> "$GITHUB_OUTPUT"

      - name: Check out pinned packaging tooling
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: kdlbs/kandev
          ref: ${{ steps.tooling.outputs.ref }}
          path: kandev
          sparse-checkout: |
            apps/backend
            pluginsdk

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Check packaging tooling pin
        working-directory: plugin
        run: |
          go mod download
          make sdk-check check-tooling-pin

      - name: Package and verify every declared platform
        working-directory: plugin
        run: make verify-package
