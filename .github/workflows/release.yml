name: release

# Manual releases validate the candidate package before they change master or tags.
# Pushed tags run the same checks before GitHub creates release assets.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Calculate the release version without committing, tagging, or publishing"
        required: true
        type: boolean
        default: false

concurrency:
  group: plugin-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  minimum-host:
    name: Check Kandev 0.88.0 compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          path: plugin

      - name: Check out minimum supported Kandev release
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: kdlbs/kandev
          ref: v0.88.0
          path: kandev
          sparse-checkout: apps/backend

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Test and package for the minimum host
        working-directory: plugin
        run: |
          set -euo pipefail
          make check-format
          make vet-minimum-host
          make test-go-minimum-host
          make test-package-verifier test-release-version
          make verify-package-host

  prepare:
    name: Validate and prepare release commit
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: minimum-host
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require master
        env:
          CURRENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$CURRENT_REF" = "refs/heads/master" || {
            echo "Run releases from master, not $CURRENT_REF." >&2
            exit 1
          }

      - name: Check out master and release tags
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          path: plugin
          ref: master
          fetch-depth: 0

      - name: Read pinned Kandev source revision
        id: sdk
        working-directory: plugin
        run: |
          set -euo pipefail
          sdk_ref="$(cat .kandev-sdk-ref)"
          [[ "$sdk_ref" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=$sdk_ref" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Kandev SDK
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: kdlbs/kandev
          ref: ${{ steps.sdk.outputs.ref }}
          path: kandev
          sparse-checkout: apps/backend

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Check SDK pin
        working-directory: plugin
        run: make check-sdk-pin

      - name: Compute next release version
        id: version
        working-directory: plugin
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          current_version="$(sed -nE 's/^version: \"([0-9]+\.[0-9]+\.[0-9]+)\"$/\1/p' manifest.yaml)"
          make_version="$(sed -nE 's/^VERSION := ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' Makefile)"
          test -n "$current_version" || { echo "manifest.yaml has no SemVer version." >&2; exit 1; }
          test "$current_version" = "$make_version" || {
            echo "manifest.yaml ($current_version) and Makefile ($make_version) disagree." >&2
            exit 1
          }

          latest_tag="$(git tag --list 'v*' | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' | sort -V | tail -n 1)"
          baseline="$(CURRENT_VERSION="$current_version" LATEST_TAG="$latest_tag" python3 - <<'PY'
          import os
          current = tuple(map(int, os.environ["CURRENT_VERSION"].split(".")))
          latest = os.environ["LATEST_TAG"].removeprefix("v")
          tagged = tuple(map(int, latest.split("."))) if latest else (0, 0, 0)
          print(".".join(map(str, max(current, tagged))))
          PY
          )"
          IFS=. read -r major minor patch <<<"$baseline"
          case "$BUMP" in
            patch) next="$major.$minor.$((patch + 1))" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            major) next="$((major + 1)).0.0" ;;
            *) echo "Unsupported version bump: $BUMP" >&2; exit 1 ;;
          esac
          tag="v$next"

          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "Tag already exists locally: $tag" >&2
            exit 1
          fi
          remote_tag="$(git ls-remote --tags origin "refs/tags/$tag")"
          test -z "$remote_tag" || { echo "Tag already exists on origin: $tag" >&2; exit 1; }

          echo "Current version: $current_version"
          echo "Latest release tag: ${latest_tag:-none}"
          echo "Next version: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Update candidate release metadata
        working-directory: plugin
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          set -euo pipefail
          sed -i -E "s/^version: \"[0-9]+\.[0-9]+\.[0-9]+\"$/version: \"$VERSION\"/" manifest.yaml
          sed -i -E "s/^VERSION := [0-9]+\.[0-9]+\.[0-9]+$/VERSION := $VERSION/" Makefile

          if [ -n "$PREVIOUS_TAG" ]; then range="$PREVIOUS_TAG..HEAD"; else range=HEAD; fi
          changes="$(git log --no-merges --format='- %s (%h)' "$range")"
          test -n "$changes" || changes="- Initial release"
          {
            echo "# Changelog"
            echo
            printf '## [%s] - %s\n\n' "$VERSION" "$(date -u +%F)"
            echo "### Changed"
            echo
            printf '%s\n' "$changes"
            echo
            test ! -f CHANGELOG.md || tail -n +2 CHANGELOG.md
          } > CHANGELOG.md.next
          mv CHANGELOG.md.next CHANGELOG.md

      - name: Run required checks and verify candidate package
        working-directory: plugin
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          make check-format
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          make vet
          make test
          make verify-package
          package_file="$(make -s package-file)"
          sh scripts/verify-release-version.sh "$TAG" "$package_file"

      - name: Report dry run
        if: ${{ inputs.dry_run }}
        run: echo "Validated candidate ${{ steps.version.outputs.tag }}. No commit, tag, or release was created."

      - name: Commit and tag validated release metadata
        if: ${{ !inputs.dry_run }}
        working-directory: plugin
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.yaml Makefile CHANGELOG.md
          git commit -m "release: $VERSION"
          git push origin HEAD:master
          git tag -a "$TAG" -m "Release $VERSION"
          git push origin "$TAG"

  publish:
    name: Verify package and publish release
    needs: [minimum-host, prepare]
    if: >-
      ${{
        always() &&
        needs.minimum-host.result == 'success' &&
        (github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && !inputs.dry_run && needs.prepare.result == 'success'))
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          path: plugin
          ref: ${{ github.event_name == 'push' && github.ref || needs.prepare.outputs.tag }}

      - name: Read pinned Kandev source revision
        id: sdk
        working-directory: plugin
        run: |
          set -euo pipefail
          sdk_ref="$(cat .kandev-sdk-ref)"
          [[ "$sdk_ref" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=$sdk_ref" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Kandev SDK
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: kdlbs/kandev
          ref: ${{ steps.sdk.outputs.ref }}
          path: kandev
          sparse-checkout: apps/backend

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Check SDK pin
        working-directory: plugin
        run: make check-sdk-pin

      - name: Verify release identity and package
        id: verify
        working-directory: plugin
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          sh scripts/verify-release-version.sh "$TAG"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          make check-format
          make vet
          make test
          make verify-package
          package_file="$(make -s package-file)"
          sh scripts/verify-release-version.sh "$TAG" "$package_file"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "package=$package_file" >> "$GITHUB_OUTPUT"

      - name: Extract checksums
        working-directory: plugin
        env:
          PACKAGE_FILE: ${{ steps.verify.outputs.package }}
        run: |
          set -euo pipefail
          tar -xOzf "$PACKAGE_FILE" checksums.txt > checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.verify.outputs.tag }}
          files: |
            plugin/${{ steps.verify.outputs.package }}
            plugin/checksums.txt
          generate_release_notes: true
